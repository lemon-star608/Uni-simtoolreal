# @package _global_
# SimToolReal MuJoCo backend owner (RL-Games SAPG tree), roadmap M-J2.
# Inherits the backend-neutral task semantics from base.yaml and declares the
# MuJoCo-line scene: one composed single-model MJCF per variant (D3), gains
# and friction baked into the asset by the writer (D6), goalviz entity
# deliberately absent (D4 — the command term skips the sim write when the
# entity is undeclared), and no table entity (the composed MJCF's table is a
# static world body; table z randomization is retired on this line — see
# roadmap §7 M-J2 known divergences).
defaults:
  - /task/simtoolreal/base
  - _self_

training:
  task_name: SimToolReal
  sim_backend: mujoco

# MuJoCo-line default scale: 12,288 envs x 1,200 tools, matching the Isaac
# line's 12,288-env comparison run (CPU single process + mjbatch threads).
# 12,288 = 6 x 2,048 keeps the SAPG exploration-block invariant
# (num_actors % expl_coef_block_size == 0 with exactly six blocks), and
# 12,288 * horizon_length(16) = 196,608 rows = 2 x 98,304 minibatches — the
# same minibatch size as the Isaac line's production runs.
algo:
  num_envs: 12288
rl_games:
  params:
    config:
      minibatch_size: 98304
      expl_coef_block_size: 2048
      central_value_config:
        minibatch_size: 98304

env:
  # MuJoCo line: composed-MJCF variant pool (robot_mjcf_writer /
  # tool_pool_mjcf), entity gains/friction baked into the asset.
  asset_format: mjcf
  scene:
    # Bootstrap composed scene (catalog[0] tool), generated deterministically
    # by the task resolver; under the fixed variant plan this file is the
    # cold-path/visual anchor, not the physics source of any env.
    model_file: ${simtoolreal_scene_mjcf:}
    # The writer bakes the home keyframe (ARM_DEFAULT_JOINT_POS + zeros +
    # object home pose) into every variant; the manager reset starts from it.
    default_keyframe_name: home
    entities:
      robot:
        # Fixed-base articulation root (scene_utils.py:1721-1725).
        root_body_name: iiwa14_link_0
        joint_names: &simtoolreal_mjcf_joints
          - iiwa14_joint_1
          - iiwa14_joint_2
          - iiwa14_joint_3
          - iiwa14_joint_4
          - iiwa14_joint_5
          - iiwa14_joint_6
          - iiwa14_joint_7
          - left_1_thumb_CMC_FE
          - left_thumb_CMC_AA
          - left_thumb_MCP_FE
          - left_thumb_MCP_AA
          - left_thumb_IP
          - left_2_index_MCP_FE
          - left_index_MCP_AA
          - left_index_PIP
          - left_index_DIP
          - left_3_middle_MCP_FE
          - left_middle_MCP_AA
          - left_middle_PIP
          - left_middle_DIP
          - left_4_ring_MCP_FE
          - left_ring_MCP_AA
          - left_ring_PIP
          - left_ring_DIP
          - left_5_pinky_CMC
          - left_pinky_MCP_FE
          - left_pinky_MCP_AA
          - left_pinky_PIP
          - left_pinky_DIP
        # The MJCF carries one <position> actuator per canonical joint, named
        # after the joint with a _ctrl suffix (robot_mjcf_writer).
        actuator_names:
          - iiwa14_joint_1_ctrl
          - iiwa14_joint_2_ctrl
          - iiwa14_joint_3_ctrl
          - iiwa14_joint_4_ctrl
          - iiwa14_joint_5_ctrl
          - iiwa14_joint_6_ctrl
          - iiwa14_joint_7_ctrl
          - left_1_thumb_CMC_FE_ctrl
          - left_thumb_CMC_AA_ctrl
          - left_thumb_MCP_FE_ctrl
          - left_thumb_MCP_AA_ctrl
          - left_thumb_IP_ctrl
          - left_2_index_MCP_FE_ctrl
          - left_index_MCP_AA_ctrl
          - left_index_PIP_ctrl
          - left_index_DIP_ctrl
          - left_3_middle_MCP_FE_ctrl
          - left_middle_MCP_AA_ctrl
          - left_middle_PIP_ctrl
          - left_middle_DIP_ctrl
          - left_4_ring_MCP_FE_ctrl
          - left_ring_MCP_AA_ctrl
          - left_ring_PIP_ctrl
          - left_ring_DIP_ctrl
          - left_5_pinky_CMC_ctrl
          - left_pinky_MCP_FE_ctrl
          - left_pinky_MCP_AA_ctrl
          - left_pinky_PIP_ctrl
          - left_pinky_DIP_ctrl
        # Palm + the five DP fingertip links (fingertip observations read the
        # DP bodies with FINGERTIP_OFFSET, exactly like the Isaac line — the
        # MJCF weld keeps those bodies and frames, M-J2 terms audit).
        body_names: [iiwa14_link_7, left_index_DP, left_middle_DP, left_ring_DP, left_thumb_DP, left_pinky_DP]
        # Fingertip frames survive the MJCF weld as sites (M-J1 decision);
        # declared for completeness — no term reads them yet.
        site_names: [left_thumb_fingertip, left_index_fingertip, left_middle_fingertip, left_ring_fingertip, left_pinky_fingertip]
      object:
        root_body_name: object_root
        body_names: [object_root]
