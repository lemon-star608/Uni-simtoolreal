# @package _global_
# MuJoCo owner: inherits the shared 29-DoF flat Manager-Based contract from
# base.yaml and carries backend/algo identity plus smoke-runnable SAPG shapes.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mujoco
algo:
  num_envs: 384
rl_games:
  params:
    config:
      # Smoke-scale SAPG shapes: num_actors must form exactly six exploration
      # blocks (the vendored native player hardcodes six), and both
      # minibatches must divide num_actors * horizon_length.
      expl_coef_block_size: 64
      minibatch_size: 1536
      central_value_config:
        minibatch_size: 1536
play_profile:
  enabled: true
  env:
    render_spacing: 2.0
