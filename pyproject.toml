[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "simtoolreal-unilab"
version = "0.1.0"
description = "SimToolReal teacher training on UniLab + UniSim with shared MJCF B-form IsaacSim and MuJoCo backends"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  # Official UniLab main at the latest commit (MuJoCo line pin discipline:
  # track upstream main, let _compat guards report drift).
  "unilab",
  # Official PyPI release of unisim-core. The [mujoco] extra pulls in the
  # mujoco/mjbatch-uni pair the MuJoCo backend is pinned and tested against;
  # the MJCF asset line's compiler gates (M-J1) run on that same pin.
  "unisim-core[mujoco]>=1.7.3",
  # Direct dep so the [tool.uv.sources] git pin applies (uv only honors
  # source overrides on the resolution path of named requirements).
  "mjbatch-uni",
  # Vendored, SHA-gated RL-Games SAPG runtime (see third_party/ and PATCHES.md).
  "unilab-simtoolreal-rl-games",
  "torch==2.8.0+cu128 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "tensorboard>=2.8",
  "tensorboardX>=2.5",
]

[project.entry-points."unilab.tasks"]
simtoolreal_unilab = "simtoolreal_unilab.tasks"

[project.scripts]
simtoolreal-train = "simtoolreal_unilab.cli:train_main"
simtoolreal-assets = "simtoolreal_unilab.assets:main"
simtoolreal-play = "simtoolreal_unilab.cli:play_main"
simtoolreal-list-envs = "simtoolreal_unilab.cli:list_main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Official upstream git pins (CI-resolvable; the local path scaffolding is
# retired now that every downstream PR has merged upstream):
# - unilab @ 838cc03e: main carrying the isaacsim solver + GPU buffer EnvCfg
#   knobs (Motphys/UniLab#1620, #1636), pre-1.3.3;
# - unisim-core @ dd983f9d: main carrying our merged adapter fixes
#   (unilabsim/unisim#279/#282/#283/#285/#286/#287/#294), pre-1.7.5;
# - mjbatch-uni @ 4edd4759: the streaming VariantPackBuilder PR branch
#   (unilabsim/mjbatch_uni#38, open) — mujoco variant executors fail closed
#   without it on current unisim main.
# Switch each to its PyPI release once one ships containing it.
unilab = { git = "https://github.com/Motphys/UniLab.git", rev = "838cc03eb62f0a2900c485b3bdf37290b1674c42" }
unisim-core = { git = "https://github.com/unilabsim/unisim.git", rev = "dd983f9d4e07983476b14928f5e2f022f3664966" }
mjbatch-uni = { git = "https://github.com/unilabsim/mjbatch_uni.git", rev = "4edd4759a1bdfd75bdbb64b68d0613f8901add81" }
unilab-simtoolreal-rl-games = { path = "third_party/simtoolreal_rl_games", editable = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-dependencies = ["torchvision"]
# The vendored runtime pins torch==2.7.0 in its (SHA-gated, immutable)
# metadata; this project trains on the cu128 build instead. The override
# keeps the vendored tree pristine while forcing our torch resolution.
override-dependencies = ["torch==2.8.0+cu128"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

# Mirrors the upstream UniLab rule set the moved code was written under.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",
    "N806",
    "E402",
    "F401",
    "N801",
    "F821",
    "E741",
    "N802",
    "N803",
    "N812",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "isaacsim: requires the IsaacSim worker runtime (skipped without UNISIM_ISAACSIM_PYTHON)",
]
addopts = "--tb=short"
