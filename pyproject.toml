[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "simtoolreal-unilab"
version = "0.1.0"
description = "SimToolReal teacher training on UniLab + UniSim with shared MJCF B-form IsaacSim and MuJoCo backends"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  # Official PyPI release (>=1.3.3 carries the isaacsim solver + GPU buffer
  # EnvCfg knobs, Motphys/UniLab#1620/#1636 — pin 总闭环).
  "unilab>=1.3.3",
  # Official PyPI release of unisim-core. >=1.7.10 carries the uniform_public_layout
  # IsaacSim support (#307, M-J6 prerequisite) plus the INIT progress/spawn
  # speedups; the [mujoco] extra pulls in the mujoco/mjbatch-uni pair the
  # MuJoCo backend is pinned and tested against.
  "unisim-core[mujoco]>=1.7.10",
  # Direct dep: mujoco variant executors on unisim >=1.7.5 fail closed
  # without the streaming VariantPackBuilder (mjbatch-uni >=0.2.4).
  "mjbatch-uni>=0.2.4",
  # Vendored, SHA-gated RL-Games SAPG runtime (see third_party/ and PATCHES.md).
  "unilab-simtoolreal-rl-games",
  "torch==2.14.0+cu130 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "tensorboard>=2.8",
  "tensorboardX>=2.5",
]

[project.entry-points."unilab.tasks"]
simtoolreal_unilab = "simtoolreal_unilab.tasks"

[project.scripts]
simtoolreal-train = "simtoolreal_unilab.cli:train_main"
simtoolreal-assets = "simtoolreal_unilab.assets:main"
simtoolreal-play = "simtoolreal_unilab.cli:play_main"
simtoolreal-list-envs = "simtoolreal_unilab.cli:list_main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
unilab-simtoolreal-rl-games = { path = "third_party/simtoolreal_rl_games", editable = true }
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
# TEMPORARY (feature branch only, never main): consume the unisim PR branch
# carrying SceneEntitySpec.joint_velocity_limits (unilabsim/unisim#323, PR
# #324).  Flip back to the PyPI floor once a unisim-core release ships it.
unisim-core = { git = "https://github.com/unilabsim/unisim", branch = "feat/dof-velocity-limit" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-dependencies = ["torchvision"]
# The vendored runtime pins torch==2.7.0 in its (SHA-gated, immutable)
# metadata; this project trains on the cu130 build instead (unilab 1.3.3
# requires torch>=2.9,<2.15; 2.14.0 is upstream's own validation target).
# The override keeps the vendored tree pristine while forcing our torch
# resolution.
override-dependencies = ["torch==2.14.0+cu130"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

# Mirrors the upstream UniLab rule set the moved code was written under.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",
    "N806",
    "E402",
    "F401",
    "N801",
    "F821",
    "E741",
    "N802",
    "N803",
    "N812",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "isaacsim: requires the IsaacSim worker runtime (skipped without UNISIM_ISAACSIM_PYTHON)",
]
addopts = "--tb=short"
